# config.yaml
#
# Single source of truth for every tunable constant in the action
# theory. Previously these lived as scattered `name(value).` facts
# directly inside moveto_continuous.pl; they are now all here instead,
# so retuning the system means editing exactly one file, in one place,
# with units documented next to each value.
#
# How this reaches the theory:
#   - config/generate_prolog_config.py turns this file into
#     config/config_generated.pl (plain Prolog facts, same names/arities
#     as before), which moveto_continuous.pl consults directly.
#   - run_plan_continuous_safety.py regenerates config_generated.pl from
#     this file automatically before every run -- you never need to run
#     the generator by hand for a normal run, only if you want to
#     inspect the generated Prolog without also running inference.
#   - collision_geometry.py (the collision/obstacle-sighted black box)
#     reads bracket_samples / crossing_eps / noise.position.sigma
#     directly from THIS file too (not from the generated .pl), so both
#     the Prolog and Python sides of the theory are driven by the exact
#     same numbers with no risk of drift.
#
# config_generated.pl is committed to the repo (like
# environments/maps/obstacles_generated.pl and
# plan_generation/plan/current_plan.pl already are) so that running
# ProbLog directly (`problog moveto_continuous.pl`, per the project's
# own testing convention) still works without going through
# run_plan_continuous_safety.py first -- but treat it as a build
# artifact: edit this file, not that one.
#
# WHAT ISN'T HERE, ON PURPOSE: which Triggers (collision/battery/
# obstacle_sighted/...) a given moveto_leg reacts to is NOT a config
# value -- moveto_continuous.pl has no default_triggers fact and no
# moveto_leg/1 sugar form. Every moveto_leg(CP,Triggers) call (in
# plan/1, or in any BT node instantiated via actions/bt_actions.py's
# moveto_leg_term) states its own Triggers list explicitly, right where
# the leg is written, e.g. moveto_leg(CP,[collision,battery]) or
# moveto_leg(CP,[]) for a genuinely unprotected leg. sight_threshold
# below is a DIFFERENT thing: it's the geometric distance that DEFINES
# what "obstacle_sighted" even means (exactly like robot.radius +
# robot.safety_buffer define what "collision" means) -- a leg still has
# to opt into reacting to obstacle_sighted by listing it in its own
# Triggers, same as any other trigger name.

robot:
  radius: 0.20          # metres -- robot_radius/1
  safety_buffer: 0.10   # metres -- safety_buffer/1 (safety_margin = radius + safety_buffer)

triggers:
  # The DEFINITION of the obstacle_sighted trigger's geometry (how close
  # counts as "sighted"), not a list of which triggers are active --
  # see the note above about there being no default trigger list.
  sight_threshold: 0.6   # metres -- must stay strictly LARGER than
                          # safety_margin (robot.radius +
                          # robot.safety_buffer above) -- a sighting
                          # that isn't detected before collision range
                          # is useless as an early warning. Checked at
                          # evaluation time by the sight_threshold_valid
                          # query; the generator also warns (non-fatally)
                          # if this file itself violates it.

motion:
  speed: 1.0   # metres per time-unit -- constant-speed spline traversal (speed/1)

noise:
  # Position (z/2, per-walk lateral drift) and battery (zbatt/1,
  # mission-wide) noise are INDEPENDENT random variables with their own
  # discretized-Gaussian tables below -- different point counts and/or
  # weights are fine, they no longer have to match. Each table's
  # weights MUST sum to EXACTLY 1.0: ProbLog silently treats missing
  # annotated-disjunction mass as an implicit "none of these" failure
  # branch, which caps EVERY downstream probability -- a real bug this
  # project hit once already. The generator checks each table's sum
  # separately and warns (but does not hard-fail, consistent with this
  # project's existing choice not to hard-stop ProbLog loads -- see
  # sight_threshold_valid's own note in moveto_continuous.pl) if either
  # is off.
  position:
    sigma: 0.15   # metres per sqrt(time-unit) -- z/2's scale (sigma/1)
    discretized_gaussian:
      - value: -2.0
        weight: 0.0606
      - value: -1.0
        weight: 0.2417
      - value: 0.0
        weight: 0.3954
      - value: 1.0
        weight: 0.2417
      - value: 2.0
        weight: 0.0606
  battery:
    sigma: 0.5   # percent per sqrt(time-unit) -- zbatt/1's scale (sigma_battery/1)
    discretized_gaussian:
      - value: -2.0
        weight: 0.0606
      - value: -1.0
        weight: 0.2417
      - value: 0.0
        weight: 0.3954
      - value: 1.0
        weight: 0.2417
      - value: 2.0
        weight: 0.0606

battery:
  start: 100                # percent -- battery_start/1
  idle_drain_rate: 0.05     # percent/time-unit while not moving
  moving_drain_rate: 0.5    # percent/time-unit while moving

tolerances:
  goal: 0.3       # metres -- goal_tolerance/1 (Status/goal_reached success check)
  on_track: 0.5   # metres -- tolerance/1 (on_track/1 drift-reporting diagnostic)

verification:
  num_samples: 20        # reporting/plotting resolution -- decoupled from
                          # detection, which is exact (see bracket_samples below)
  bracket_samples: 60    # collision/obstacle_sighted bracket-scan sample count
  crossing_eps: 0.01     # bisection refinement tolerance, time-units
