# ============================================================
# schema.yaml
#
# Node model for the BehaviorTree.cpp library, describing every
# ACTION and CONDITION currently encoded in basic_action_theory.pl's
# do_node/4 / holds/2 clauses. This is the YAML analogue of what
# BT.cpp's own <TreeNodesModel> XML section captures (ID, port
# direction, port type) -- one entry per node here corresponds to
# one <Action ID="..."> / <Condition ID="..."> entry there, and this
# file is written so a mechanical XML generator could produce a
# valid TreeNodesModel from it later without redesigning anything.
#
# NOT included here, and why:
#   - Sequence / Fallback: these map DIRECTLY to BT.cpp's own
#     BUILT-IN control nodes (<Sequence>, <Fallback>) -- exactly
#     seq_node/1 and fallback_node/1 in basic_action_theory.pl. BT.cpp
#     doesn't require (or allow) declaring built-in node types in a
#     TreeNodesModel, so there is nothing to add here for them.
#   - and(P,Q) / or(P,Q): NOT modeled as condition nodes. BT.cpp's
#     own idiom achieves conjunction via a Sequence of conditions and
#     disjunction via a Fallback of conditions -- i.e. the SAME
#     structural composition already used for actions, rather than a
#     dedicated logical-AND/OR leaf. Modeling and/or as their own
#     condition nodes would fight that idiom rather than use it.
#   - neg(P): NOT modeled as a condition node either -- BT.cpp has a
#     built-in <Inverter> DECORATOR for exactly this (wrap any single
#     child, invert its result), which is the idiomatic way to negate
#     a condition in a BT.cpp tree, rather than a separate negated
#     leaf per condition.
#
# Implementations matching this schema live in bt_actions.py -- see
# that file's own header for how each entry below corresponds to a
# concrete Python callable (or, for MoveTo, an interface/spec rather
# than an executable stand-in -- explained there).
#
# An actual BT.cpp XML tree validated/translated against this schema
# lives at the problem's own behavior_tree.xml (problems/<name>/behavior_tree.xml) -- see
# module/translators/bt_to_prolog.py for the concrete XML attribute
# encoding this project uses for each port TYPE below (Point as
# "X;Y", std::vector<std::string> as ";"-separated, and the
# {blackboard_key} convention every BT.cpp port already uses for
# ports that are wired to another node rather than given a literal
# value -- this schema only describes port TYPES/directions, not a
# serialization, so it stays agnostic of that choice).
#
# TWO ports -- triggers (input, on MoveTo/InstallTool/UninstallTool/
# DeployTool/RetractTool) and reason (output, on nearly every action)
# -- stay declared here because module/translators/bt_to_prolog.py
# genuinely needs them: triggers is a real XML attribute it parses
# (extra halting conditions, reactive-guard derivation -- see that
# file's own module docstring); reason is where the auto-generated
# Prolog Reason term (tag_reason/3) conceptually lives, even though no
# tree ever binds it to a literal attribute. NEITHER belongs in an
# ACTUAL BT.cpp-facing <TreeNodesModel> a real C++ program would read,
# though (a Groot-facing declaration, as opposed to this schema's own
# translator-validation use) -- reason is a Prolog-Reason-atom
# artifact status/control_points/value already make redundant for a
# real node, and triggers is how THIS project's own reactive-interrupt
# derivation gets threaded into a Prolog term, not a concept a real
# C++ node needs (BT.cpp's own ReactiveSequence/ReactiveFallback/
# Decorator nodes already cover that at the TREE-STRUCTURE level).
# Every problem's own hand-written <TreeNodesModel> (in its own
# behavior_tree.xml) already omits both for exactly this reason -- a
# mechanical generator built from this file later should too.
# ============================================================

schema_version: 1
bt_cpp_target_format: 4    # BTCPP_format="4" -- the XML attribute a
                            # generated TreeNodesModel should carry

actions:

  # ----------------------------------------------------------------
  # MoveTo -- corresponds to moveto_leg(ControlPoints,Triggers) in
  # basic_action_theory.pl, i.e. one startMoveto/haltMoveto pair run to
  # its halt.
  # ----------------------------------------------------------------
  - id: MoveTo
    prolog_action: moveto_leg
    description: >
      Runs one durative moveto leg along ControlPoints, halting on
      whichever of Triggers occurs earliest (or on natural
      completion if none do). Reason/Status are haltMoveto's own two
      outputs -- see basic_action_theory.pl's own header comment on
      what they mean (Reason=completed only means the walk wasn't cut
      short; Status is true in that case regardless of where the walk
      actually landed -- whether it landed close enough to its own
      intended target is now a SEPARATE, explicit check, see
      DistanceBelow below).
    ports:
      - name: control_points
        direction: input
        type: std::vector<Point>
        required: true
        description: >
          Chained cubic Bezier control points, length 3k+1. Typically
          bound by a preceding PlanWith node sharing
          the same port/blackboard entry -- see
          basic_action_theory.pl's own note on the "leave a variable
          free, let a prior step bind it" pattern.
      - name: triggers
        direction: input
        type: std::vector<std::string>
        required: false
        description: >
          EXTRA halting conditions this leg reacts to, beyond what's
          automatic (see below) -- OPTIONAL, may be omitted or empty.
          Two things are no longer written here at all, since
          module/translators/bt_to_prolog.py now adds them to every
          MoveTo automatically: collision (fixed threshold, the
          robot's own safety margin) and battery (fixed threshold,
          exactly 0% -- only added when this problem's own config.yaml
          has battery.enabled: true). ALSO automatic: a STRUCTURAL
          guard for every Condition left sibling of this MoveTo's own
          branch under an enclosing <ReactiveSequence>/
          <ReactiveFallback> ancestor (optionally wrapped in
          <Inverter>) -- e.g. a <BatteryOver threshold="70"/> left
          sibling under a <ReactiveSequence> automatically makes this
          leg halt the moment battery drops to 70%, with NO triggers=
          entry needed for it (see bt_to_prolog.py's own module
          docstring, "CONTROL-FLOW GUARD DERIVATION", and
          basic_action_theory.pl's guard_break(Cond,Code)/holds_leg/9
          for the underlying generic mechanism). What's left to write
          here explicitly is only a leg-INTRINSIC termination
          condition that isn't derivable from tree structure at all --
          e.g. a Bug-algorithm leg's own line_of_sight_clear/
          crosses_segment stopping rule. Other valid entries (for that
          purpose, or for backward compatibility with an older tree
          that still spells out collision/battery here -- harmless,
          just redundant): obstacle_in_bound(Threshold) (a GENERIC,
          per-call obstacle-proximity trigger -- what "obstacle
          sighted" was renamed to; fires on proximity to ANY
          obstacle's boundary, whether or not the trajectory ever
          actually enters it), obstacle_on_path(Threshold) (the SAME
          per-call proximity idea, but restricted to obstacles the
          trajectory ACTUALLY ENTERS somewhere along the walk -- a
          genuinely different, stricter geometric test, not another
          threshold for obstacle_in_bound; see
          first_on_path_crossing_time's own note in
          basic_action_theory.pl), battery_below(Threshold) /
          battery_equal(Threshold) / battery_over(Threshold) (the same
          per-call idea for battery level, at <, =, and > respectively
          -- all THREE are SEPARATE, additional triggers from the
          fixed battery=0% one, not replacements for it; battery_over
          currently only ever fires immediately or never, since
          battery never rises within a walk today, but is structured
          for a genuine future-crossing search once recharging is
          modeled -- see first_battery_over_time's own note in
          basic_action_theory.pl), line_of_sight_clear(ObstacleId,GX,GY)
          / crosses_segment(SX,SY,GX,GY) (the Bug0/Bug2 boundary-LEAVE
          triggers for a leg whose ControlPoints came from a preceding
          PlanWith(algorithm=follow_boarder) node -- fires respectively as soon as
          ObstacleId stops occluding a straight line to (GX,GY), or
          when the walk re-crosses segment (SX,SY)-(GX,GY) at a point
          closer to (GX,GY) than (SX,SY) was; see collision_geometry.py's
          "BUG-ALGORITHM BOUNDARY-LEAVE PRIMITIVES" section for the
          full geometry) (see trigger_crossing_time/11 in
          basic_action_theory.pl for the complete, current list -- a
          future trigger added there needs no schema change beyond
          documenting its name here). Written in a BT.cpp XML tree as
          a semicolon-separated string, e.g.
          triggers="obstacle_in_bound(0.6);battery_below(20)", or the
          attribute omitted entirely if this leg needs nothing beyond
          the automatic collision/battery/structural-guard triggers.
      - name: reason
        direction: output
        type: std::string
        description: >
          One of: completed, battery_depleted, crashed(ObstacleId),
          obstacle_in_bound(Threshold,ObstacleId),
          obstacle_on_path(Threshold,ObstacleId), battery_under(Threshold),
          battery_equal(Threshold), battery_over(Threshold), or any
          other entry from triggers that actually fired.
          crashed/obstacle_in_bound/obstacle_on_path carry WHICH
          obstacle_polygon/2 Id they fired against (an argmin over
          obstacles at the exact crossing point, computed by
          collision_geometry.py), not just that one fired. Every
          battery_* Reason above also carries the Threshold that was
          crossed (echoing the trigger's own argument). Reason functors
          deliberately differ from their trigger names ONLY where a
          distinct word was actually requested -- battery_below's
          Reason is battery_under (mirroring collision/crashed's own
          asymmetry), while battery_equal/battery_over keep the SAME
          functor as their trigger name.
      - name: status
        direction: output
        type: bool
        description: >
          true iff reason=completed, i.e. the walk ran its full
          nominal duration without any trigger cutting it short.
          Says NOTHING about whether the final position also landed
          close to this leg's own endpoint -- pair this MoveTo with a
          DistanceBelow condition right after it (in a Sequence) if
          that also needs checking (see DistanceBelow below).

  # ----------------------------------------------------------------
  # ONE planner action, ALL four algorithms -- dispatched, underneath,
  # through the SAME parametrized Prolog predicate --
  # planWith(Algorithm,Goal,CP,ActionCode) / plan_call/8 with Algorithm
  # read straight off this node's own `algorithm` port -- and the SAME
  # underlying Python implementation in bt_actions.py, parametrized by
  # algorithm. An EARLIER version of this schema modeled astar/
  # straight/voronoi/follow_boarder as four separate BT.cpp Action IDs
  # (PlanAstar/PlanStraight/PlanVoronoi/FollowBoarder), each hardcoding
  # its own Algorithm as a fixed dispatch entry -- but the underlying
  # theory already treated Algorithm as ONE runtime value planWith/
  # plan_call dispatch on, never four different predicates, so the
  # BT.cpp-facing split was purely cosmetic duplication, not a real
  # interface difference; collapsed into one node here to match.
  # ----------------------------------------------------------------
  - id: PlanWith
    prolog_action: planWith
    description: >
      Runs whichever planner `algorithm` names, from the CURRENT
      position (now/2 + at/4) to an EXPLICIT goal port (NOT a global
      goal/2 fact -- this is what lets two planning calls in the same
      tree target genuinely different destinations, e.g. a
      "GoTo(target)" subtree instantiated twice with two different
      port bindings for target). Instantaneous -- does not advance
      simulated time or move the robot; only computes ControlPoints
      for a SUBSEQUENT MoveTo to use. Records a
      planned(Algorithm,Reason) marker in the situation history for
      traceability (see planned_with/3) -- it does NOT gate on a
      precondition; a planner call is always attempted, its
      Reason/Status simply report whether a path was found. Reason
      itself carries not just completed/no_path but ALSO which
      ActionCode this specific PlanWith occurrence is (mirroring
      MoveTo's own ActionCode -- see MoveTo's own reason port above),
      which algorithm ran, and which point it was working toward (see
      the reason port below) -- so two PlanWith calls in the same tree
      failing with no_path are always distinguishable, the same way
      two MoveTo legs crashing are.

      Four `algorithm` values are supported, each with its own ports
      actually used (goal for astar/straight/voronoi; obstacle_id +
      offset for follow_boarder -- see each port's own description for
      which):
        astar    -- black-box A* (planners.py's plan_astar/5).
        straight -- direct straight-line planner (planners.py's
          plan_straight/5), no map lookup, a single degenerate
          (collinear-control-point) Bezier segment; only fails
          (no_path) for degenerate/non-finite input.
        voronoi  -- generalized-Voronoi-diagram roadmap planner
          (planners.py's plan_voronoi/5): builds a roadmap from
          scipy's Voronoi diagram of points sampled along every
          obstacle's own boundary (every edge is, by construction,
          maximally clear of the obstacles that produced it), filters
          out any ridge that crosses into an obstacle, then connects
          the current position and goal to the closest POINT on the
          closest EDGE of that roadmap and takes the shortest path
          through it. Degrades to a straight line (never fails) when
          there are no obstacles to route around; only fails (no_path)
          if a roadmap exists but start/goal are genuinely
          disconnected within it.
        follow_boarder -- boundary-following (planners.py's
          follow_boarder/5), shared by EVERY Bug-algorithm variant:
          from the current position, traces a FULL CLOCKWISE LOOP
          around obstacle_id's own obstacle_polygon/2 boundary, offset
          outward by `offset`. Deliberately has NO goal port and NO
          stopping condition of its own -- it does NOT decide when to
          leave the boundary at all, it just plans the full loop; WHICH
          Bug variant a leg implements is entirely a matter of which
          trigger the SUBSEQUENT MoveTo node's own `triggers` port
          names (line_of_sight_clear(ObstacleId,GX,GY) for Bug0,
          crosses_segment(SX,SY,GX,GY) for Bug2 -- see MoveTo's own
          triggers port description above, and LineOfSightClear's
          entry further down for the condition-node form of the
          first one). `offset` is typically unified with the SAME
          Threshold as whichever obstacle_on_path(Threshold)/
          obstacle_in_bound(Threshold) trigger/condition supplied
          obstacle_id in the first place -- a small residual gap
          between the robot's actual position and that nominal offset
          (from bisection tolerance, not noise -- see
          first_on_path_crossing_time's own note) is harmless,
          absorbed into the planner's own first path segment. Since
          this algorithm has no real goal point, its own Reason
          reports `none` where astar/straight/voronoi would report
          the point they were working toward (see the reason port
          below).
    ports:
      - name: algorithm
        direction: input
        type: std::string
        required: true
        description: >
          One of: astar, straight, voronoi, follow_boarder -- written
          VERBATIM as Prolog text (a bare atom for the first three;
          for follow_boarder, this port names the ALGORITHM, its own
          obstacle_id/offset ports below carry the rest). Picks both
          which ports below are actually required (goal for the first
          three; obstacle_id+offset for follow_boarder) and which
          plan_call/8 clause runs.
      - name: goal
        direction: input
        type: Point
        required: false
        description: >
          Target position for this planning call -- REQUIRED when
          algorithm is astar/straight/voronoi, and must be OMITTED
          when algorithm is follow_boarder (which has no goal point at
          all -- see its own note above). Maps directly to planWith's
          own point(GX,GY) argument in basic_action_theory.pl --
          per-call, not shared across other planning calls in the same
          tree. Either a literal "X;Y" OR a blackboard reference like
          "{target}" bound by an earlier node's own Point output (e.g.
          NearestToolOfKind's own position) -- the ONE exception to
          this schema's usual "input ports are literals" rule (same
          treatment InstallTool/DeployTool/RetractTool/UninstallTool's
          own tool port gets, below); when blackboard-sourced, this
          call's own Reason records the ground atom `wild` in place of
          the concrete point (unknown until runtime), same convention
          an argmin ObstacleId already uses elsewhere.
      - name: obstacle_id
        direction: input
        type: std::string
        required: false
        description: >
          Which obstacle_polygon/2 Id to circle -- REQUIRED when
          algorithm is follow_boarder, and must be OMITTED otherwise.
          Written VERBATIM as Prolog text (a bare atom, e.g.
          obstacle_id="obs5"), same convention as HaltedWith's own
          reason port below -- NOT quoted. Typically the SAME
          ObstacleId a preceding trigger/condition reported (e.g.
          obstacle_on_path(Threshold,ObstacleId)'s second argument).
      - name: offset
        direction: input
        type: double
        required: false
        description: >
          Distance to maintain from the obstacle's own boundary edge
          while circling it, metres -- REQUIRED when algorithm is
          follow_boarder, and must be OMITTED otherwise. Same units/
          definition as obstacle_in_bound/obstacle_on_path's own
          Threshold (raw clearance to the polygon boundary; this
          planner does not separately add robot radius/safety_buffer,
          so pass a Threshold that already accounts for them if that's
          the intent, same as every other Threshold in this schema).
      - name: control_points
        direction: output
        type: std::vector<Point>
        description: >
          The planned path, as chained cubic Bezier control points --
          shape depends on algorithm (a single Bezier segment for
          straight; a roadmap-routed or clockwise-loop path for
          voronoi/follow_boarder; etc., see each algorithm's own note
          above). Empty if reason=no_path(...).
      - name: reason
        direction: output
        type: std::string
        description: >
          completed(Algorithm,Goal,ActionCode) or
          no_path(Algorithm,Goal,ActionCode) -- Algorithm is this
          node's own `algorithm` value (follow_boarder(ObstacleId,
          Offset) as a compound term when algorithm=follow_boarder,
          matching plan_call/8's own dispatch shape; a bare atom
          otherwise), Goal is the point(GX,GY) this call was working
          toward (the atom `none` for follow_boarder, which has none),
          and ActionCode identifies WHICH PlanWith occurrence in the
          tree this is (same per-occurrence code MoveTo's own reason
          port already uses).
      - name: status
        direction: output
        type: bool
        description: "true iff reason is completed(...)."

  # ----------------------------------------------------------------
  # TakeSample -- corresponds to take_sample(SampleId,ActionCode) in
  # basic_action_theory.pl. INSTANTANEOUS, like PlanWith above (does
  # not advance now/2, no Duration/Triggers, no continuous trajectory)
  # -- but UNLIKE every other action in this schema, its outcome is a
  # genuine new probabilistic choice, not a deterministic function of
  # the current situation/geometry: a single fixed-probability coin
  # flip (this problem's own config.yaml, sample.success_probability
  # -- defaults to 0.5 if omitted), independent per occurrence (see
  # basic_action_theory.pl's own do_node(take_sample(...)) note on
  # exactly what "independent" means here -- keyed on the SITUATION,
  # not on the robot's physical state). ONLY on success, a SECOND,
  # independent random draw produces a VALUE too -- a discretized
  # Normal(mean,sigma) over the integers 0..10 (sample.value.mean/
  # sigma, this problem's own config.yaml, defaulting to mean=5.0/
  # sigma=2.0) -- see SampleValueBelow/SampleValueEqual/SampleValueOver
  # further down for checking it against a threshold.
  # ----------------------------------------------------------------
  - id: TakeSample
    prolog_action: take_sample
    description: >
      An instantaneous action with no target/goal/trigger of its own:
      succeeds or fails via a single fixed-probability coin flip
      (sample.success_probability, this problem's own config.yaml),
      and on success draws a further VALUE (0..10, sample.value.mean/
      sigma) recorded under this node's own id. Records the robot's
      own current position (at/4) at the instant of sampling as part
      of its own Reason -- see the reason port below, and
      basic_action_theory.pl's own sample_success_at/3 for querying
      WHERE a successful sample landed.
    ports:
      - name: id
        direction: input
        type: std::string
        required: true
        description: >
          This occurrence's own name (e.g. "soil1"), chosen by the
          tree author -- NOT the auto-generated ActionCode every
          action's own reason port already carries. A later
          SampleValueBelow/SampleValueEqual/SampleValueOver condition
          node references this SAME id to check what value THIS
          specific sample came back with. Must be a valid Prolog atom
          (lowercase-start, letters/digits/underscores).
      - name: reason
        direction: output
        type: std::string
        description: >
          sample_success(X,Y,V,SampleId,ActionCode) or sample_failure
          (X,Y,SampleId,ActionCode) -- X,Y is the robot's own position
          (metres, map frame) at the instant this action ran; V (only
          present on success) is the drawn value, 0..10; SampleId is
          this node's own id port, above; ActionCode identifies WHICH
          TakeSample occurrence in the tree this is (same per-
          occurrence code every other action's own reason port
          already uses).
      - name: status
        direction: output
        type: bool
        description: "true iff reason is sample_success(...)."

  # ----------------------------------------------------------------
  # InstallTool / UninstallTool -- correspond to install_tool_leg
  # (Tool,Triggers,ActionCode)/uninstall_tool_leg(Tool,Triggers,
  # ActionCode) in basic_action_theory.pl: DURATIVE actions, same
  # start/halt shape as MoveTo (a fixed-Duration analogue of one
  # startMoveto/haltMoveto pair -- see that action's own do_node note),
  # but the robot never moves: no CP/position noise of its own at all.
  # Duration is FIXED per (action, tool) pair (this problem's own
  # config.yaml, tool.install.duration_seconds.<tool>/tool.uninstall.
  # duration_seconds.<tool> -- defaults to 10 seconds if omitted), not
  # derived from spline arc length. Preconditions (see basic_action_
  # theory.pl's own poss(start_install_tool(...))/poss(start_uninstall_
  # tool(...))): neither can start while the robot is moving;
  # InstallTool additionally requires hitch(free,S) (nothing already
  # attached); UninstallTool requires hitch(Tool,S) (THIS SPECIFIC tool
  # -- not just "something" -- currently attached). Success/failure is
  # a genuine coin flip too, same "not a deterministic function of
  # geometry" shape as TakeSample above (tool.install.success_
  # probability/tool.uninstall.success_probability, this problem's own
  # config.yaml, default 0.9) -- but ONLY once the full Duration
  # elapses with nothing halting it early; a battery trigger firing
  # first halts it with THAT Reason instead, same "earliest wins"
  # mechanism MoveTo's own Triggers already use.
  # ----------------------------------------------------------------
  - id: InstallTool
    prolog_action: install_tool_leg
    description: >
      Runs a fixed-Duration install of `tool` (a specific tool INSTANCE
      id, e.g. "cart1" -- this problem's own config.yaml tool.instances
      -- not a kind; see basic_action_theory.pl's own tool_instance/2),
      halting early on whichever of `triggers` occurs first, or
      resolving a success/failure coin flip once the full Duration
      elapses with nothing halting it early (see this entry's own
      header above for the full mechanism). Only battery-related
      trigger names are accepted -- the robot never moves during this
      action, so a motion-based trigger has no meaningful geometry to
      check (see the triggers port's own description below).
    ports:
      - name: tool
        direction: input
        type: std::string
        required: true
        description: >
          A tool INSTANCE id from this problem's own config.yaml
          tool.instances (e.g. "cart1"), NOT a kind -- multiple
          instances of the same kind (cart/plow) can exist. Not
          validated against a fixed set at translation time (this
          translator never parses config.yaml); an unknown id simply
          makes this action's own precondition unsatisfiable (see
          basic_action_theory.pl's own poss(start_install_tool(...))).
          Either a literal id OR a blackboard reference like "{tool}"
          bound by an earlier node's own std::string output (e.g.
          NearestToolOfKind's own id, or HitchedId's) -- see PlanWith's
          own goal port note above for the full "literal OR blackboard
          ref" convention this follows, including the `wild` Reason
          substitution when blackboard-sourced.
      - name: triggers
        direction: input
        type: std::vector<std::string>
        required: false
        description: >
          EXTRA halting conditions, beyond the automatic battery=0%
          one -- OPTIONAL, may be omitted or empty. RESTRICTED to
          battery-related names ONLY: battery_below(Threshold),
          battery_equal(Threshold), battery_over(Threshold) (see
          MoveTo's own triggers port for what each means -- the
          semantics are identical, just evaluated against the IDLE
          drain rate, since this action never moves the robot). A
          motion-based name (collision, obstacle_in_bound(...),
          obstacle_on_path(...), line_of_sight_clear(...),
          crosses_segment(...)) is a HARD translation-time error here
          -- there is no path/geometry for it to check.
      - name: reason
        direction: output
        type: std::string
        description: >
          install_tool_success(Tool,ActionCode)/install_tool_failure
          (Tool,ActionCode) if the full Duration elapsed, or
          battery_depleted/battery_under(Threshold)/battery_equal
          (Threshold)/battery_over(Threshold) if a battery trigger
          fired first (same Reason vocabulary MoveTo's own battery
          triggers use).
      - name: status
        direction: output
        type: bool
        description: "true iff reason is install_tool_success(...)."

  - id: UninstallTool
    prolog_action: uninstall_tool_leg
    description: >
      The mirror image of InstallTool above -- same ports/mechanism,
      uninstall_tool_success(Tool,ActionCode)/uninstall_tool_failure
      (Tool,ActionCode) in place of install_tool_success/
      install_tool_failure. Requires hitch_id(Tool,S) to start (THIS
      SPECIFIC tool INSTANCE currently attached, not just any instance
      of its kind), not just hitch(free,S)'s own negation -- AND
      \+ deployed(S): a tool currently deployed (see DeployTool/
      RetractTool below) must be retracted first, it cannot be
      uninstalled while still lowered.
    ports:
      - name: tool
        direction: input
        type: std::string
        required: true
        description: >
          The tool INSTANCE id (e.g. "cart1") currently attached --
          same id= an earlier <InstallTool> in this tree used. Either a
          literal or a blackboard reference (e.g. HitchedId's own id
          output) -- see InstallTool's own tool port note above.
      - name: triggers
        direction: input
        type: std::vector<std::string>
        required: false
        description: "Same battery-only restriction as InstallTool's own triggers port."
      - name: reason
        direction: output
        type: std::string
        description: >
          uninstall_tool_success(Tool,ActionCode)/uninstall_tool_failure
          (Tool,ActionCode), or a battery Reason -- same shape as
          InstallTool's own reason port.
      - name: status
        direction: output
        type: bool
        description: "true iff reason is uninstall_tool_success(...)."

  # ----------------------------------------------------------------
  # DeployTool / RetractTool -- correspond to deploy_tool_leg(Tool,
  # Triggers,ActionCode)/retract_tool_leg(Tool,Triggers,ActionCode) in
  # basic_action_theory.pl: SAME shape as InstallTool/UninstallTool
  # above (fixed Duration, battery-only triggers, robot must be still,
  # coin-flip success/failure once the full Duration elapses) -- but
  # lowers/raises a tool that's ALREADY installed, rather than
  # attaching/detaching it. Currently restricted to tool kind=plow ONLY
  # (checked at the Prolog level, since this translator never parses
  # config.yaml to know a given id's own kind -- see basic_action_
  # theory.pl's own poss(start_deploy_tool(...))); other tool kinds may
  # gain their own deploy/retract behaviour later.
  #
  # WHY THIS EXISTS, SEPARATELY FROM InstallTool/UninstallTool: merely
  # having the plow installed (hitch(plow,S)) does NOT plough anything
  # while the robot moves -- basic_action_theory.pl's own ploughed/3
  # additionally requires deployed(S), which only becomes true between
  # a successful DeployTool and its matching RetractTool. Between the
  # two, MoveTo's own speed and battery drain rate also switch to the
  # DEPLOYED-specific values (tool.equipped.plow.deployed_speed/
  # deployed_moving_drain_rate, this problem's own config.yaml, see
  # basic_action_theory.pl's own effective_tool_speed/3).
  #
  # Preconditions: neither can start while the robot is moving.
  # DeployTool additionally requires hitch_id(Tool,S) (THIS SPECIFIC
  # instance currently attached -- can't deploy something not
  # installed) and \+ deployed(S) (not already deployed). RetractTool
  # requires hitch_id(Tool,S) AND deployed(S) (can't retract what
  # isn't deployed). UninstallTool, in turn, now requires \+ deployed
  # (S) too -- a deployed tool must be retracted before it can be
  # uninstalled (see UninstallTool's own note above).
  # ----------------------------------------------------------------
  - id: DeployTool
    prolog_action: deploy_tool_leg
    description: >
      Runs a fixed-Duration deploy (lower into the ground) of `tool`,
      an ALREADY-INSTALLED tool instance id whose own kind must
      currently be plow. Halts early on whichever of `triggers` occurs
      first, or resolves a success/failure coin flip once the full
      Duration elapses with nothing halting it early (tool.deploy.
      success_probability, this problem's own config.yaml, default
      0.9). Only battery-related trigger names are accepted, same
      restriction as InstallTool's own triggers port.
    ports:
      - name: tool
        direction: input
        type: std::string
        required: true
        description: >
          The tool INSTANCE id (e.g. "plow1") currently attached --
          same id= an earlier <InstallTool> in this tree used. Its own
          kind must be plow (checked at the Prolog level, not here).
          Either a literal or a blackboard reference (e.g. HitchedId's
          own id output) -- see InstallTool's own tool port note above.
      - name: triggers
        direction: input
        type: std::vector<std::string>
        required: false
        description: "Same battery-only restriction as InstallTool's own triggers port."
      - name: reason
        direction: output
        type: std::string
        description: >
          deploy_tool_success(Tool,ActionCode)/deploy_tool_failure
          (Tool,ActionCode), or a battery Reason -- same shape as
          InstallTool's own reason port.
      - name: status
        direction: output
        type: bool
        description: "true iff reason is deploy_tool_success(...)."

  - id: RetractTool
    prolog_action: retract_tool_leg
    description: >
      The mirror image of DeployTool above -- same ports/mechanism,
      retract_tool_success(Tool,ActionCode)/retract_tool_failure(Tool,
      ActionCode) in place of deploy_tool_success/deploy_tool_failure
      (tool.retract.success_probability, default 0.9). Requires `tool`
      to be currently DEPLOYED to start, not just attached.
    ports:
      - name: tool
        direction: input
        type: std::string
        required: true
        description: >
          The tool INSTANCE id (e.g. "plow1") currently deployed --
          same id= an earlier <DeployTool> in this tree used. Either a
          literal or a blackboard reference (e.g. HitchedId's own id
          output) -- see InstallTool's own tool port note above.
      - name: triggers
        direction: input
        type: std::vector<std::string>
        required: false
        description: "Same battery-only restriction as InstallTool's own triggers port."
      - name: reason
        direction: output
        type: std::string
        description: >
          retract_tool_success(Tool,ActionCode)/retract_tool_failure
          (Tool,ActionCode), or a battery Reason -- same shape as
          InstallTool's own reason port.
      - name: status
        direction: output
        type: bool
        description: "true iff reason is retract_tool_success(...)."

  # ----------------------------------------------------------------
  # ToolPosition / ToolsOfKind / NearestToolOfKind -- correspond to
  # tool_position_query(Id,Position,ActionCode)/tools_of_kind_query
  # (Kind,Tools,ActionCode)/nearest_tool_of_kind_query(Kind,Id,Position,
  # ActionCode) in basic_action_theory.pl. Pure, side-effect-free QUERY
  # leaves against tool_position/4, tools_of_kind/5, nearest_tool_of_
  # kind/6 (Section 5c/5d) -- INSTANTANEOUS, like PlanWith/TakeSample,
  # but with no precondition of their own to state (unlike TakeSample,
  # they can be asked ANYTIME, not just \+ moving(S)) and no world-
  # changing effect at all (unlike TakeSample's own genuine coin flip,
  # these never draw new randomness -- asking twice in the same
  # situation always reports the SAME answer).
  #
  # NearestToolOfKind is NOT simply "ToolPosition then ToolsOfKind
  # chained in the tree" -- picking the CLOSEST candidate needs an
  # argmin fold (findall/3 + a hand-written min_candidate/2 in the
  # theory, since ProbLog has no aggregate_all/3) that has no BT.cpp-
  # tree-composable equivalent, so it is its own self-contained leaf --
  # even though its own Prolog implementation internally composes
  # tools_of_kind/5 (which itself composes tool_instance/2 with tool_
  # position/4), that composition happens ENTIRELY inside one Prolog
  # predicate, not across multiple tree nodes.
  # ----------------------------------------------------------------
  - id: ToolPosition
    prolog_action: tool_position_query
    description: >
      Looks up WHERE tool instance `id` currently sits. Succeeds
      (status=true) iff it's a known instance (config.yaml tool.
      instances) that is NOT currently hitched -- a hitched tool's
      position is wherever the robot is, not a separate thing to track,
      so this fails for one (see basic_action_theory.pl's own
      tool_position/4 note).
    ports:
      - name: id
        direction: input
        type: std::string
        required: true
        description: "A tool INSTANCE id, e.g. \"cart1\" -- a literal, not yet blackboard-wireable."
      - name: position
        direction: output
        type: Point
        description: "Bound to the tool's own current (X,Y) if found."
      - name: reason
        direction: output
        type: std::string
        description: "tool_position_found(Id) or tool_position_unavailable(Id)."
      - name: status
        direction: output
        type: bool
        description: "true iff reason is tool_position_found(...)."

  - id: ToolsOfKind
    prolog_action: tools_of_kind_query
    description: >
      Lists every instance of `kind` that currently has a position
      (i.e. is not hitched). Succeeds (status=true) iff at least one
      such instance exists.
    ports:
      - name: kind
        direction: input
        type: std::string
        required: true
        description: "cart, plow, or any future kind -- not validated against a fixed set here (this translator never parses config.yaml)."
      - name: tools
        direction: output
        type: std::string
        description: "Bound to a Prolog list of tool(Id,point(X,Y)) terms, one per matching free instance."
      - name: reason
        direction: output
        type: std::string
        description: "tools_of_kind_found(Kind) or tools_of_kind_empty(Kind)."
      - name: status
        direction: output
        type: bool
        description: "true iff reason is tools_of_kind_found(...)."

  - id: NearestToolOfKind
    prolog_action: nearest_tool_of_kind_query
    description: >
      Picks whichever free instance of `kind` is closest to the
      robot's own CURRENT position right now. Succeeds (status=true)
      iff `kind` has at least one free instance.
    ports:
      - name: kind
        direction: input
        type: std::string
        required: true
        description: "cart, plow, or any future kind -- same validation as ToolsOfKind's own kind port."
      - name: id
        direction: output
        type: std::string
        description: "Bound to the closest matching instance's own id."
      - name: position
        direction: output
        type: Point
        description: "Bound to that instance's own current (X,Y)."
      - name: reason
        direction: output
        type: std::string
        description: "nearest_tool_found(Kind,Id) or no_tool_of_kind(Kind)."
      - name: status
        direction: output
        type: bool
        description: "true iff reason is nearest_tool_found(...)."

  - id: HitchedId
    prolog_action: hitched_id_query
    description: >
      Looks up the id of WHATEVER tool is currently hitched (if any) --
      no input port, unlike ToolPosition/ToolsOfKind/NearestToolOfKind:
      it reports on the hitch's own current state directly (basic_
      action_theory.pl's own hitch_id/2), not a lookup keyed by
      kind/id. Succeeds (status=true) iff something is currently
      hitched. Exists so a tree can say "deploy/retract/uninstall
      WHATEVER is hitched right now" without needing to have plumbed
      that id in from wherever it was originally installed -- e.g. a
      tool that was ALREADY hitched before some "make sure it's
      installed" guard even ran never flows through an InstallTool/
      NearestToolOfKind occurrence in THAT run at all.
    ports:
      - name: id
        direction: output
        type: std::string
        description: "Bound to the currently-hitched instance's own id, if any."
      - name: reason
        direction: output
        type: std::string
        description: "hitched_id_found(Id) or hitched_id_unavailable."
      - name: status
        direction: output
        type: bool
        description: "true iff reason is hitched_id_found(...)."

conditions:

  # ----------------------------------------------------------------
  # holds(distance_below(GX,GY,Threshold), S) /
  # holds(distance_equal(GX,GY,Threshold), S) /
  # holds(distance_over(GX,GY,Threshold), S) in basic_action_theory.pl
  # -- THREE separate condition nodes sharing one description/port
  # shape, same "one shared shape, several functors" idea as
  # BatteryBelow/BatteryEqual/BatteryOver below. This is also what
  # used to be baked directly into MoveTo's own status port (see
  # MoveTo's own description above) -- extracted out into its own
  # explicit, inspectable condition, typically placed in a Sequence
  # right after the MoveTo whose landing accuracy it's meant to check.
  # ----------------------------------------------------------------
  - id: DistanceBelow
    prolog_condition: distance_below
    description: >
      True iff the CURRENT position (now/2 + at/4) is within
      threshold of an EXPLICIT point -- PARAMETRIZED, same as
      ObstacleInBound/BatteryBelow/etc., not a lookup against any
      global "the goal" fact (there is no such fact in this theory).
      Typical uses: the first child of a Fallback, to skip planning/
      moving entirely if already there; or placed right after a
      MoveTo, in sequence, to check that the leg's own noisy final
      position actually landed close enough to its intended target
      (pass the SAME point as whichever PlanWith node's own...
      node's own goal port targeted, or as the MoveTo's own last
      control point, if that's the intent).
    ports:
      - name: goal
        direction: input
        type: Point
        required: true
        description: >
          The point to check proximity to -- see PlanWith's own goal
          port.
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  - id: DistanceEqual
    prolog_condition: distance_equal
    description: >
      True iff the CURRENT position (now/2 + at/4) is EXACTLY
      threshold distance from an EXPLICIT point (arithmetic equality)
      -- same shape as DistanceBelow above. In a continuous,
      noise-driven model this is only true at whatever instant the
      distance genuinely passes through threshold (same caveat as
      BatteryEqual below) -- checking it at an arbitrary current time
      will usually be false.
    ports:
      - name: goal
        direction: input
        type: Point
        required: true
        description: >
          The point to check proximity to -- see PlanWith's own goal
          port.
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  - id: DistanceOver
    prolog_condition: distance_over
    description: >
      True iff the CURRENT position (now/2 + at/4) is further than
      threshold distance from an EXPLICIT point -- same shape as
      DistanceBelow above.
    ports:
      - name: goal
        direction: input
        type: Point
        required: true
        description: >
          The point to check proximity to -- see PlanWith's own goal
          port.
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  # ----------------------------------------------------------------
  # holds(halted_with_cond(Reason), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: HaltedWith
    prolog_condition: halted_with_cond
    description: >
      True iff SOMEWHERE in the situation history EITHER a MoveTo
      halted OR a PlanWith finished with exactly this Reason (searches
      the WHOLE history, not just the most recent one -- see
      halted_with/2's own comment). ACTION-INDEPENDENT on purpose: this
      one condition covers every action's own halting/completion
      Reason, not just MoveTo's -- the two Reason vocabularies never
      collide since they differ in arity even where they share a
      functor name (MoveTo's completed(ActionCode) is arity 1;
      PlanWith's completed(Algorithm,Goal,ActionCode) is arity 3).
      Lets a condition branch on how a PREVIOUS leg OR planning call
      ended.
    ports:
      - name: reason
        direction: input
        type: std::string
        required: true
        description: >
          From MoveTo: one of completed(ActionCode),
          battery_depleted(ActionCode), crashed(ObstacleId,ActionCode),
          obstacle_in_bound(Threshold,ObstacleId,ActionCode),
          battery_under(Threshold,ActionCode), or any other Reason
          from MoveTo's own reason port above (same notes on crashed/
          obstacle_in_bound carrying WHICH obstacle, and obstacle_in_
          bound/battery_under also carrying WHICH threshold, apply
          here). From PlanWith: completed(Algorithm,Goal,ActionCode)
          or no_path(Algorithm,Goal,ActionCode) -- see PlanWith's own
          reason port above. Written exactly as valid Prolog text,
          e.g. reason="crashed(_,_)" to match ANY crash regardless of
          obstacle/ActionCode (a bare reason="crashed" no longer
          matches anything -- a bare atom never unifies with a
          compound term of the same name), reason="crashed(obs5,_)"
          for one specific obstacle, reason="battery_under(20,_)" for
          one specific threshold, or reason="no_path(astar,_,_)" for
          any failed astar planning call.

  # ----------------------------------------------------------------
  # holds(obstacle_in_bound(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: ObstacleInBound
    prolog_condition: obstacle_in_bound
    description: >
      True iff the CURRENT position (now/2 + at/4) is within
      Threshold of ANY obstacle -- a single-point check reusing the
      exact same underlying geometry (collision_geometry.py's
      within_obstacle_threshold/_min_clearance_all) as the
      obstacle_in_bound(Threshold) TRIGGER, just evaluated once
      instead of searched across a whole future trajectory. This is
      what "obstacle sighted" was renamed to; there is no fixed global
      threshold anymore -- every use, trigger or condition, supplies
      its own.
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  # ----------------------------------------------------------------
  # holds(obstacle_on_path(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: ObstacleOnPath
    prolog_condition: obstacle_on_path
    description: >
      True iff the CURRENT position (now/2 + at/4) is within
      Threshold of an obstacle THIS WALK'S OWN TRAJECTORY actually
      enters (goes geometrically inside, not just near) somewhere
      across its full span -- a genuinely stricter, different test
      from ObstacleInBound above, not another threshold for it: a
      trajectory can graze within ObstacleInBound's Threshold of an
      obstacle's boundary (e.g. because that threshold already
      accounts for the robot's own radius) without ever actually
      entering the obstacle's interior, in which case ObstacleOnPath
      does NOT fire for it. Needs the CURRENT walk's own trajectory
      to check against, so this fails outright before any walk has
      started (e.g. at s0) -- see holds(obstacle_on_path(...))'s own
      comment in basic_action_theory.pl.
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  # ----------------------------------------------------------------
  # holds(battery_below(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: BatteryBelow
    prolog_condition: battery_below
    description: >
      True iff the CURRENT battery level (now/2 + battery/3) is below
      Threshold -- a single battery/3 lookup, no black box involved.
      SEPARATE from, and additional to, the fixed battery (=0%)
      trigger/HaltedWith(battery_depleted) case -- this is a
      genuinely different, caller-chosen threshold, not a replacement.
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Battery level threshold, percent (0-100).

  # ----------------------------------------------------------------
  # holds(battery_equal(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: BatteryEqual
    prolog_condition: battery_equal
    description: >
      True iff the CURRENT battery level (now/2 + battery/3) is EXACTLY
      Threshold (arithmetic equality) -- a single battery/3 lookup, no
      black box involved. In a continuous, noise-driven model this is
      only true at whatever instant Level(T) genuinely passes through
      Threshold (see first_battery_equal_time's own note in
      basic_action_theory.pl) -- checking it at an arbitrary current time
      will usually be false.
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Battery level threshold, percent (0-100).

  # ----------------------------------------------------------------
  # holds(battery_over(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: BatteryOver
    prolog_condition: battery_over
    description: >
      True iff the CURRENT battery level (now/2 + battery/3) is above
      Threshold -- a single battery/3 lookup, no black box involved.
      As a CONDITION this is an ordinary, well-defined point-in-time
      check; only its TRIGGER counterpart is degenerate (see
      first_battery_over_time's own note in basic_action_theory.pl for
      why -- battery never rises within a walk).
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Battery level threshold, percent (0-100).

  # ----------------------------------------------------------------
  # holds(sample_value_below/equal/over(SampleId,Threshold), S) in
  # basic_action_theory.pl -- checks the VALUE a SUCCESSFUL <TakeSample
  # id="..."/> came back with (see that entry's own note), NOT a live
  # geometry/battery lookup like BatteryOver above: a sample's own
  # value is fixed the instant it's drawn (TakeSample is instantaneous,
  # no Duration to elapse), so this is a HISTORY lookup (searches S's
  # whole history for a matching sample_success, same shape HaltedWith
  # uses) -- NON-CONTINUOUS for exactly that reason (excluded from
  # automatic reactive-guard derivation, same treatment HaltedWith
  # gets, see bt_to_prolog.py's own _NON_CONTINUOUS_CONDITIONS). Fails
  # (neither true nor false, simply unsatisfied) if id never had a
  # successful sample anywhere in S's history.
  # ----------------------------------------------------------------
  - id: SampleValueBelow
    prolog_condition: sample_value_below
    description: >
      True iff the value <TakeSample id="..."/> recorded (0..10) is
      below Threshold.
    ports:
      - name: id
        direction: input
        type: std::string
        required: true
        description: "Must match the id= of an earlier <TakeSample> in this tree."
      - name: threshold
        direction: input
        type: double
        required: true
        description: "Value threshold, 0-10."

  - id: SampleValueEqual
    prolog_condition: sample_value_equal
    description: >
      True iff the value <TakeSample id="..."/> recorded (0..10) is
      exactly Threshold.
    ports:
      - name: id
        direction: input
        type: std::string
        required: true
        description: "Must match the id= of an earlier <TakeSample> in this tree."
      - name: threshold
        direction: input
        type: double
        required: true
        description: "Value threshold, 0-10."

  - id: SampleValueOver
    prolog_condition: sample_value_over
    description: >
      True iff the value <TakeSample id="..."/> recorded (0..10) is
      above Threshold.
    ports:
      - name: id
        direction: input
        type: std::string
        required: true
        description: "Must match the id= of an earlier <TakeSample> in this tree."
      - name: threshold
        direction: input
        type: double
        required: true
        description: "Value threshold, 0-10."

  # ----------------------------------------------------------------
  # holds(hitched,S)/holds(hitched(Kind),S) in basic_action_theory.pl --
  # a thin BT-tree-facing wrapper around hitch/2 (Section 5c), which is
  # a plain fluent, not itself holds(...)-wrapped. NON-CONTINUOUS (see
  # bt_to_prolog.py's own _NON_CONTINUOUS_CONDITIONS note) -- hitch/2 is
  # provably constant for the whole span of any one MoveTo leg.
  # ----------------------------------------------------------------
  - id: Hitched
    prolog_condition: hitched
    description: >
      True iff a tool is currently attached (kind omitted), or
      specifically a tool of `kind` is (kind given).
    ports:
      - name: kind
        direction: input
        type: std::string
        required: false
        description: "cart or plow -- OMIT to check \"is anything attached\" instead of one specific kind."

  # ----------------------------------------------------------------
  # holds(deployed,S) in basic_action_theory.pl -- a thin BT-tree-
  # facing wrapper around deployed/1 (Section 5d). No ports -- only one
  # tool can ever be hitched at a time, so there is nothing to
  # parametrize (unlike Hitched's own optional kind). Same NON-
  # CONTINUOUS treatment as Hitched above, for the same reason.
  # ----------------------------------------------------------------
  - id: Deployed
    prolog_condition: deployed
    description: "True iff the currently-hitched tool is deployed (lowered), not just attached."
    ports: []

  # ----------------------------------------------------------------
  # holds(ploughed_at(GX,GY),S)/holds(ploughed_between(X1,Y1,X2,Y2),S)
  # in basic_action_theory.pl -- thin BT-tree-facing wrappers around
  # ploughed/3 (the cell-indexed ploughing fluent the plow-deploy leg
  # already marks), discretizing a continuous point/pair-of-points
  # through the SAME plough_cell_size grid ploughed/3 itself uses.
  # NON-CONTINUOUS (see bt_to_prolog.py's own _NON_CONTINUOUS_
  # CONDITIONS note) -- ploughed/3 only ever becomes newly true at a
  # MoveTo leg's own halt/interrupt, never incrementally mid-leg.
  # ----------------------------------------------------------------
  - id: PloughedAt
    prolog_condition: ploughed_at
    description: "True iff the cell at goal is already ploughed."
    ports:
      - name: goal
        direction: input
        type: Point
        required: true
        description: "\"X;Y\" -- discretized to a cell via this problem's own ploughing.cell_size before checking."

  - id: PloughedBetween
    prolog_condition: ploughed_between
    description: >
      True iff EVERY cell the straight line connecting p1's own cell
      center to p2's touches is already ploughed (standard integer
      Bresenham line algorithm over the discretized grid -- NOT the
      full axis-aligned box spanned by p1/p2) -- "has this whole
      SWATH already been ploughed".
    ports:
      - name: p1
        direction: input
        type: Point
        required: true
        description: "\"X;Y\" -- one corner of the box to check."
      - name: p2
        direction: input
        type: Point
        required: true
        description: "\"X;Y\" -- the opposite corner of the box to check."

  # ----------------------------------------------------------------
  # holds(line_of_sight_clear(ObstacleId,GX,GY), S) in
  # basic_action_theory.pl -- Bug0's own boundary-leave rule as a
  # standalone condition node. NO CrossesSegment condition counterpart
  # exists -- "has my trajectory crossed this segment" is fundamentally
  # an event over an interval of motion, not a fact true at a single
  # instant the way this one is; see collision_geometry.py's own "BUG-
  # ALGORITHM BOUNDARY-LEAVE PRIMITIVES" section for the full reasoning.
  # crosses_segment(SX,SY,GX,GY) remains usable as a MoveTo TRIGGER
  # (see MoveTo's own triggers port above) -- just not as a Condition
  # leaf on its own.
  # ----------------------------------------------------------------
  - id: LineOfSightClear
    prolog_condition: line_of_sight_clear
    description: >
      True iff the CURRENT position (now/2 + at/4) is NOT occluded
      from goal by obstacle_id's own boundary -- a single-point check
      reusing the exact same underlying geometry (collision_geometry.py's
      line_of_sight_clear/segment_crosses_polygon) as the
      line_of_sight_clear(ObstacleId,GX,GY) TRIGGER (Bug0's own leave
      rule), just evaluated once instead of searched across a whole
      future trajectory.
    ports:
      - name: obstacle_id
        direction: input
        type: std::string
        required: true
        description: >
          Which obstacle_polygon/2 Id to check occlusion against --
          see PlanWith's own obstacle_id port.
      - name: goal
        direction: input
        type: Point
        required: true
        description: >
          The point line-of-sight is checked toward -- see PlanWith's
          own goal port.