# ============================================================
# schema.yaml
#
# Node model for the BehaviorTree.cpp library, describing every
# ACTION and CONDITION currently encoded in basic_action_theory.pl's
# do_node/4 / holds/2 clauses. This is the YAML analogue of what
# BT.cpp's own <TreeNodesModel> XML section captures (ID, port
# direction, port type) -- one entry per node here corresponds to
# one <Action ID="..."> / <Condition ID="..."> entry there, and this
# file is written so a mechanical XML generator could produce a
# valid TreeNodesModel from it later without redesigning anything.
#
# NOT included here, and why:
#   - Sequence / Fallback: these map DIRECTLY to BT.cpp's own
#     BUILT-IN control nodes (<Sequence>, <Fallback>) -- exactly
#     seq_node/1 and fallback_node/1 in basic_action_theory.pl. BT.cpp
#     doesn't require (or allow) declaring built-in node types in a
#     TreeNodesModel, so there is nothing to add here for them.
#   - and(P,Q) / or(P,Q): NOT modeled as condition nodes. BT.cpp's
#     own idiom achieves conjunction via a Sequence of conditions and
#     disjunction via a Fallback of conditions -- i.e. the SAME
#     structural composition already used for actions, rather than a
#     dedicated logical-AND/OR leaf. Modeling and/or as their own
#     condition nodes would fight that idiom rather than use it.
#   - neg(P): NOT modeled as a condition node either -- BT.cpp has a
#     built-in <Inverter> DECORATOR for exactly this (wrap any single
#     child, invert its result), which is the idiomatic way to negate
#     a condition in a BT.cpp tree, rather than a separate negated
#     leaf per condition.
#
# Implementations matching this schema live in bt_actions.py -- see
# that file's own header for how each entry below corresponds to a
# concrete Python callable (or, for MoveTo, an interface/spec rather
# than an executable stand-in -- explained there).
#
# An actual BT.cpp XML tree validated/translated against this schema
# lives at the problem's own behavior_tree.xml (problems/<name>/behavior_tree.xml) -- see
# module/translators/bt_to_prolog.py for the concrete XML attribute
# encoding this project uses for each port TYPE below (Point as
# "X;Y", std::vector<std::string> as ";"-separated, and the
# {blackboard_key} convention every BT.cpp port already uses for
# ports that are wired to another node rather than given a literal
# value -- this schema only describes port TYPES/directions, not a
# serialization, so it stays agnostic of that choice).
# ============================================================

schema_version: 1
bt_cpp_target_format: 4    # BTCPP_format="4" -- the XML attribute a
                            # generated TreeNodesModel should carry

actions:

  # ----------------------------------------------------------------
  # MoveTo -- corresponds to moveto_leg(ControlPoints,Triggers) in
  # basic_action_theory.pl, i.e. one startMoveto/haltMoveto pair run to
  # its halt.
  # ----------------------------------------------------------------
  - id: MoveTo
    prolog_action: moveto_leg
    description: >
      Runs one durative moveto leg along ControlPoints, halting on
      whichever of Triggers occurs earliest (or on natural
      completion if none do). Reason/Status are haltMoveto's own two
      outputs -- see basic_action_theory.pl's own header comment on
      what they mean (Reason=completed only means the walk wasn't cut
      short; Status is true in that case regardless of where the walk
      actually landed -- whether it landed close enough to its own
      intended target is now a SEPARATE, explicit check, see
      DistanceBelow below).
    ports:
      - name: control_points
        direction: input
        type: std::vector<Point>
        required: true
        description: >
          Chained cubic Bezier control points, length 3k+1. Typically
          bound by a preceding PlanWith node sharing
          the same port/blackboard entry -- see
          basic_action_theory.pl's own note on the "leave a variable
          free, let a prior step bind it" pattern.
      - name: triggers
        direction: input
        type: std::vector<std::string>
        required: false
        description: >
          EXTRA halting conditions this leg reacts to, beyond what's
          automatic (see below) -- OPTIONAL, may be omitted or empty.
          Two things are no longer written here at all, since
          module/translators/bt_to_prolog.py now adds them to every
          MoveTo automatically: collision (fixed threshold, the
          robot's own safety margin) and battery (fixed threshold,
          exactly 0% -- only added when this problem's own config.yaml
          has battery.enabled: true). ALSO automatic: a STRUCTURAL
          guard for every Condition left sibling of this MoveTo's own
          branch under an enclosing <ReactiveSequence>/
          <ReactiveFallback> ancestor (optionally wrapped in
          <Inverter>) -- e.g. a <BatteryOver threshold="70"/> left
          sibling under a <ReactiveSequence> automatically makes this
          leg halt the moment battery drops to 70%, with NO triggers=
          entry needed for it (see bt_to_prolog.py's own module
          docstring, "CONTROL-FLOW GUARD DERIVATION", and
          basic_action_theory.pl's guard_break(Cond,Code)/holds_leg/9
          for the underlying generic mechanism). What's left to write
          here explicitly is only a leg-INTRINSIC termination
          condition that isn't derivable from tree structure at all --
          e.g. a Bug-algorithm leg's own line_of_sight_clear/
          crosses_segment stopping rule. Other valid entries (for that
          purpose, or for backward compatibility with an older tree
          that still spells out collision/battery here -- harmless,
          just redundant): obstacle_in_bound(Threshold) (a GENERIC,
          per-call obstacle-proximity trigger -- what "obstacle
          sighted" was renamed to; fires on proximity to ANY
          obstacle's boundary, whether or not the trajectory ever
          actually enters it), obstacle_on_path(Threshold) (the SAME
          per-call proximity idea, but restricted to obstacles the
          trajectory ACTUALLY ENTERS somewhere along the walk -- a
          genuinely different, stricter geometric test, not another
          threshold for obstacle_in_bound; see
          first_on_path_crossing_time's own note in
          basic_action_theory.pl), battery_below(Threshold) /
          battery_equal(Threshold) / battery_over(Threshold) (the same
          per-call idea for battery level, at <, =, and > respectively
          -- all THREE are SEPARATE, additional triggers from the
          fixed battery=0% one, not replacements for it; battery_over
          currently only ever fires immediately or never, since
          battery never rises within a walk today, but is structured
          for a genuine future-crossing search once recharging is
          modeled -- see first_battery_over_time's own note in
          basic_action_theory.pl), line_of_sight_clear(ObstacleId,GX,GY)
          / crosses_segment(SX,SY,GX,GY) (the Bug0/Bug2 boundary-LEAVE
          triggers for a leg whose ControlPoints came from a preceding
          PlanWith(algorithm=follow_boarder) node -- fires respectively as soon as
          ObstacleId stops occluding a straight line to (GX,GY), or
          when the walk re-crosses segment (SX,SY)-(GX,GY) at a point
          closer to (GX,GY) than (SX,SY) was; see collision_geometry.py's
          "BUG-ALGORITHM BOUNDARY-LEAVE PRIMITIVES" section for the
          full geometry) (see trigger_crossing_time/11 in
          basic_action_theory.pl for the complete, current list -- a
          future trigger added there needs no schema change beyond
          documenting its name here). Written in a BT.cpp XML tree as
          a semicolon-separated string, e.g.
          triggers="obstacle_in_bound(0.6);battery_below(20)", or the
          attribute omitted entirely if this leg needs nothing beyond
          the automatic collision/battery/structural-guard triggers.
      - name: reason
        direction: output
        type: std::string
        description: >
          One of: completed, battery_depleted, crashed(ObstacleId),
          obstacle_in_bound(Threshold,ObstacleId),
          obstacle_on_path(Threshold,ObstacleId), battery_under(Threshold),
          battery_equal(Threshold), battery_over(Threshold), or any
          other entry from triggers that actually fired.
          crashed/obstacle_in_bound/obstacle_on_path carry WHICH
          obstacle_polygon/2 Id they fired against (an argmin over
          obstacles at the exact crossing point, computed by
          collision_geometry.py), not just that one fired. Every
          battery_* Reason above also carries the Threshold that was
          crossed (echoing the trigger's own argument). Reason functors
          deliberately differ from their trigger names ONLY where a
          distinct word was actually requested -- battery_below's
          Reason is battery_under (mirroring collision/crashed's own
          asymmetry), while battery_equal/battery_over keep the SAME
          functor as their trigger name.
      - name: status
        direction: output
        type: bool
        description: >
          true iff reason=completed, i.e. the walk ran its full
          nominal duration without any trigger cutting it short.
          Says NOTHING about whether the final position also landed
          close to this leg's own endpoint -- pair this MoveTo with a
          DistanceBelow condition right after it (in a Sequence) if
          that also needs checking (see DistanceBelow below).

  # ----------------------------------------------------------------
  # ONE planner action, ALL four algorithms -- dispatched, underneath,
  # through the SAME parametrized Prolog predicate --
  # planWith(Algorithm,Goal,CP,ActionCode) / plan_call/8 with Algorithm
  # read straight off this node's own `algorithm` port -- and the SAME
  # underlying Python implementation in bt_actions.py, parametrized by
  # algorithm. An EARLIER version of this schema modeled astar/
  # straight/voronoi/follow_boarder as four separate BT.cpp Action IDs
  # (PlanAstar/PlanStraight/PlanVoronoi/FollowBoarder), each hardcoding
  # its own Algorithm as a fixed dispatch entry -- but the underlying
  # theory already treated Algorithm as ONE runtime value planWith/
  # plan_call dispatch on, never four different predicates, so the
  # BT.cpp-facing split was purely cosmetic duplication, not a real
  # interface difference; collapsed into one node here to match.
  # ----------------------------------------------------------------
  - id: PlanWith
    prolog_action: planWith
    description: >
      Runs whichever planner `algorithm` names, from the CURRENT
      position (now/2 + at/4) to an EXPLICIT goal port (NOT a global
      goal/2 fact -- this is what lets two planning calls in the same
      tree target genuinely different destinations, e.g. a
      "GoTo(target)" subtree instantiated twice with two different
      port bindings for target). Instantaneous -- does not advance
      simulated time or move the robot; only computes ControlPoints
      for a SUBSEQUENT MoveTo to use. Records a
      planned(Algorithm,Reason) marker in the situation history for
      traceability (see planned_with/3) -- it does NOT gate on a
      precondition; a planner call is always attempted, its
      Reason/Status simply report whether a path was found. Reason
      itself carries not just completed/no_path but ALSO which
      ActionCode this specific PlanWith occurrence is (mirroring
      MoveTo's own ActionCode -- see MoveTo's own reason port above),
      which algorithm ran, and which point it was working toward (see
      the reason port below) -- so two PlanWith calls in the same tree
      failing with no_path are always distinguishable, the same way
      two MoveTo legs crashing are.

      Four `algorithm` values are supported, each with its own ports
      actually used (goal for astar/straight/voronoi; obstacle_id +
      offset for follow_boarder -- see each port's own description for
      which):
        astar    -- black-box A* (planners.py's plan_astar/5).
        straight -- direct straight-line planner (planners.py's
          plan_straight/5), no map lookup, a single degenerate
          (collinear-control-point) Bezier segment; only fails
          (no_path) for degenerate/non-finite input.
        voronoi  -- generalized-Voronoi-diagram roadmap planner
          (planners.py's plan_voronoi/5): builds a roadmap from
          scipy's Voronoi diagram of points sampled along every
          obstacle's own boundary (every edge is, by construction,
          maximally clear of the obstacles that produced it), filters
          out any ridge that crosses into an obstacle, then connects
          the current position and goal to the closest POINT on the
          closest EDGE of that roadmap and takes the shortest path
          through it. Degrades to a straight line (never fails) when
          there are no obstacles to route around; only fails (no_path)
          if a roadmap exists but start/goal are genuinely
          disconnected within it.
        follow_boarder -- boundary-following (planners.py's
          follow_boarder/5), shared by EVERY Bug-algorithm variant:
          from the current position, traces a FULL CLOCKWISE LOOP
          around obstacle_id's own obstacle_polygon/2 boundary, offset
          outward by `offset`. Deliberately has NO goal port and NO
          stopping condition of its own -- it does NOT decide when to
          leave the boundary at all, it just plans the full loop; WHICH
          Bug variant a leg implements is entirely a matter of which
          trigger the SUBSEQUENT MoveTo node's own `triggers` port
          names (line_of_sight_clear(ObstacleId,GX,GY) for Bug0,
          crosses_segment(SX,SY,GX,GY) for Bug2 -- see MoveTo's own
          triggers port description above, and LineOfSightClear's
          entry further down for the condition-node form of the
          first one). `offset` is typically unified with the SAME
          Threshold as whichever obstacle_on_path(Threshold)/
          obstacle_in_bound(Threshold) trigger/condition supplied
          obstacle_id in the first place -- a small residual gap
          between the robot's actual position and that nominal offset
          (from bisection tolerance, not noise -- see
          first_on_path_crossing_time's own note) is harmless,
          absorbed into the planner's own first path segment. Since
          this algorithm has no real goal point, its own Reason
          reports `none` where astar/straight/voronoi would report
          the point they were working toward (see the reason port
          below).
    ports:
      - name: algorithm
        direction: input
        type: std::string
        required: true
        description: >
          One of: astar, straight, voronoi, follow_boarder -- written
          VERBATIM as Prolog text (a bare atom for the first three;
          for follow_boarder, this port names the ALGORITHM, its own
          obstacle_id/offset ports below carry the rest). Picks both
          which ports below are actually required (goal for the first
          three; obstacle_id+offset for follow_boarder) and which
          plan_call/8 clause runs.
      - name: goal
        direction: input
        type: Point
        required: false
        description: >
          Target position for this planning call -- REQUIRED when
          algorithm is astar/straight/voronoi, and must be OMITTED
          when algorithm is follow_boarder (which has no goal point at
          all -- see its own note above). Maps directly to planWith's
          own point(GX,GY) argument in basic_action_theory.pl --
          per-call, not shared across other planning calls in the same
          tree.
      - name: obstacle_id
        direction: input
        type: std::string
        required: false
        description: >
          Which obstacle_polygon/2 Id to circle -- REQUIRED when
          algorithm is follow_boarder, and must be OMITTED otherwise.
          Written VERBATIM as Prolog text (a bare atom, e.g.
          obstacle_id="obs5"), same convention as HaltedWith's own
          reason port below -- NOT quoted. Typically the SAME
          ObstacleId a preceding trigger/condition reported (e.g.
          obstacle_on_path(Threshold,ObstacleId)'s second argument).
      - name: offset
        direction: input
        type: double
        required: false
        description: >
          Distance to maintain from the obstacle's own boundary edge
          while circling it, metres -- REQUIRED when algorithm is
          follow_boarder, and must be OMITTED otherwise. Same units/
          definition as obstacle_in_bound/obstacle_on_path's own
          Threshold (raw clearance to the polygon boundary; this
          planner does not separately add robot radius/safety_buffer,
          so pass a Threshold that already accounts for them if that's
          the intent, same as every other Threshold in this schema).
      - name: control_points
        direction: output
        type: std::vector<Point>
        description: >
          The planned path, as chained cubic Bezier control points --
          shape depends on algorithm (a single Bezier segment for
          straight; a roadmap-routed or clockwise-loop path for
          voronoi/follow_boarder; etc., see each algorithm's own note
          above). Empty if reason=no_path(...).
      - name: reason
        direction: output
        type: std::string
        description: >
          completed(Algorithm,Goal,ActionCode) or
          no_path(Algorithm,Goal,ActionCode) -- Algorithm is this
          node's own `algorithm` value (follow_boarder(ObstacleId,
          Offset) as a compound term when algorithm=follow_boarder,
          matching plan_call/8's own dispatch shape; a bare atom
          otherwise), Goal is the point(GX,GY) this call was working
          toward (the atom `none` for follow_boarder, which has none),
          and ActionCode identifies WHICH PlanWith occurrence in the
          tree this is (same per-occurrence code MoveTo's own reason
          port already uses).
      - name: status
        direction: output
        type: bool
        description: "true iff reason is completed(...)."

conditions:

  # ----------------------------------------------------------------
  # holds(distance_below(GX,GY,Threshold), S) /
  # holds(distance_equal(GX,GY,Threshold), S) /
  # holds(distance_over(GX,GY,Threshold), S) in basic_action_theory.pl
  # -- THREE separate condition nodes sharing one description/port
  # shape, same "one shared shape, several functors" idea as
  # BatteryBelow/BatteryEqual/BatteryOver below. This is also what
  # used to be baked directly into MoveTo's own status port (see
  # MoveTo's own description above) -- extracted out into its own
  # explicit, inspectable condition, typically placed in a Sequence
  # right after the MoveTo whose landing accuracy it's meant to check.
  # ----------------------------------------------------------------
  - id: DistanceBelow
    prolog_condition: distance_below
    description: >
      True iff the CURRENT position (now/2 + at/4) is within
      threshold of an EXPLICIT point -- PARAMETRIZED, same as
      ObstacleInBound/BatteryBelow/etc., not a lookup against any
      global "the goal" fact (there is no such fact in this theory).
      Typical uses: the first child of a Fallback, to skip planning/
      moving entirely if already there; or placed right after a
      MoveTo, in sequence, to check that the leg's own noisy final
      position actually landed close enough to its intended target
      (pass the SAME point as whichever PlanWith node's own...
      node's own goal port targeted, or as the MoveTo's own last
      control point, if that's the intent).
    ports:
      - name: goal
        direction: input
        type: Point
        required: true
        description: >
          The point to check proximity to -- see PlanWith's own goal
          port.
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  - id: DistanceEqual
    prolog_condition: distance_equal
    description: >
      True iff the CURRENT position (now/2 + at/4) is EXACTLY
      threshold distance from an EXPLICIT point (arithmetic equality)
      -- same shape as DistanceBelow above. In a continuous,
      noise-driven model this is only true at whatever instant the
      distance genuinely passes through threshold (same caveat as
      BatteryEqual below) -- checking it at an arbitrary current time
      will usually be false.
    ports:
      - name: goal
        direction: input
        type: Point
        required: true
        description: >
          The point to check proximity to -- see PlanWith's own goal
          port.
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  - id: DistanceOver
    prolog_condition: distance_over
    description: >
      True iff the CURRENT position (now/2 + at/4) is further than
      threshold distance from an EXPLICIT point -- same shape as
      DistanceBelow above.
    ports:
      - name: goal
        direction: input
        type: Point
        required: true
        description: >
          The point to check proximity to -- see PlanWith's own goal
          port.
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  # ----------------------------------------------------------------
  # holds(halted_with_cond(Reason), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: HaltedWith
    prolog_condition: halted_with_cond
    description: >
      True iff SOMEWHERE in the situation history EITHER a MoveTo
      halted OR a PlanWith finished with exactly this Reason (searches
      the WHOLE history, not just the most recent one -- see
      halted_with/2's own comment). ACTION-INDEPENDENT on purpose: this
      one condition covers every action's own halting/completion
      Reason, not just MoveTo's -- the two Reason vocabularies never
      collide since they differ in arity even where they share a
      functor name (MoveTo's completed(ActionCode) is arity 1;
      PlanWith's completed(Algorithm,Goal,ActionCode) is arity 3).
      Lets a condition branch on how a PREVIOUS leg OR planning call
      ended.
    ports:
      - name: reason
        direction: input
        type: std::string
        required: true
        description: >
          From MoveTo: one of completed(ActionCode),
          battery_depleted(ActionCode), crashed(ObstacleId,ActionCode),
          obstacle_in_bound(Threshold,ObstacleId,ActionCode),
          battery_under(Threshold,ActionCode), or any other Reason
          from MoveTo's own reason port above (same notes on crashed/
          obstacle_in_bound carrying WHICH obstacle, and obstacle_in_
          bound/battery_under also carrying WHICH threshold, apply
          here). From PlanWith: completed(Algorithm,Goal,ActionCode)
          or no_path(Algorithm,Goal,ActionCode) -- see PlanWith's own
          reason port above. Written exactly as valid Prolog text,
          e.g. reason="crashed(_,_)" to match ANY crash regardless of
          obstacle/ActionCode (a bare reason="crashed" no longer
          matches anything -- a bare atom never unifies with a
          compound term of the same name), reason="crashed(obs5,_)"
          for one specific obstacle, reason="battery_under(20,_)" for
          one specific threshold, or reason="no_path(astar,_,_)" for
          any failed astar planning call.

  # ----------------------------------------------------------------
  # holds(obstacle_in_bound(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: ObstacleInBound
    prolog_condition: obstacle_in_bound
    description: >
      True iff the CURRENT position (now/2 + at/4) is within
      Threshold of ANY obstacle -- a single-point check reusing the
      exact same underlying geometry (collision_geometry.py's
      within_obstacle_threshold/_min_clearance_all) as the
      obstacle_in_bound(Threshold) TRIGGER, just evaluated once
      instead of searched across a whole future trajectory. This is
      what "obstacle sighted" was renamed to; there is no fixed global
      threshold anymore -- every use, trigger or condition, supplies
      its own.
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  # ----------------------------------------------------------------
  # holds(obstacle_on_path(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: ObstacleOnPath
    prolog_condition: obstacle_on_path
    description: >
      True iff the CURRENT position (now/2 + at/4) is within
      Threshold of an obstacle THIS WALK'S OWN TRAJECTORY actually
      enters (goes geometrically inside, not just near) somewhere
      across its full span -- a genuinely stricter, different test
      from ObstacleInBound above, not another threshold for it: a
      trajectory can graze within ObstacleInBound's Threshold of an
      obstacle's boundary (e.g. because that threshold already
      accounts for the robot's own radius) without ever actually
      entering the obstacle's interior, in which case ObstacleOnPath
      does NOT fire for it. Needs the CURRENT walk's own trajectory
      to check against, so this fails outright before any walk has
      started (e.g. at s0) -- see holds(obstacle_on_path(...))'s own
      comment in basic_action_theory.pl.
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Distance threshold, metres.

  # ----------------------------------------------------------------
  # holds(battery_below(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: BatteryBelow
    prolog_condition: battery_below
    description: >
      True iff the CURRENT battery level (now/2 + battery/3) is below
      Threshold -- a single battery/3 lookup, no black box involved.
      SEPARATE from, and additional to, the fixed battery (=0%)
      trigger/HaltedWith(battery_depleted) case -- this is a
      genuinely different, caller-chosen threshold, not a replacement.
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Battery level threshold, percent (0-100).

  # ----------------------------------------------------------------
  # holds(battery_equal(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: BatteryEqual
    prolog_condition: battery_equal
    description: >
      True iff the CURRENT battery level (now/2 + battery/3) is EXACTLY
      Threshold (arithmetic equality) -- a single battery/3 lookup, no
      black box involved. In a continuous, noise-driven model this is
      only true at whatever instant Level(T) genuinely passes through
      Threshold (see first_battery_equal_time's own note in
      basic_action_theory.pl) -- checking it at an arbitrary current time
      will usually be false.
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Battery level threshold, percent (0-100).

  # ----------------------------------------------------------------
  # holds(battery_over(Threshold), S) in basic_action_theory.pl.
  # ----------------------------------------------------------------
  - id: BatteryOver
    prolog_condition: battery_over
    description: >
      True iff the CURRENT battery level (now/2 + battery/3) is above
      Threshold -- a single battery/3 lookup, no black box involved.
      As a CONDITION this is an ordinary, well-defined point-in-time
      check; only its TRIGGER counterpart is degenerate (see
      first_battery_over_time's own note in basic_action_theory.pl for
      why -- battery never rises within a walk).
    ports:
      - name: threshold
        direction: input
        type: double
        required: true
        description: Battery level threshold, percent (0-100).

  # ----------------------------------------------------------------
  # holds(line_of_sight_clear(ObstacleId,GX,GY), S) in
  # basic_action_theory.pl -- Bug0's own boundary-leave rule as a
  # standalone condition node. NO CrossesSegment condition counterpart
  # exists -- "has my trajectory crossed this segment" is fundamentally
  # an event over an interval of motion, not a fact true at a single
  # instant the way this one is; see collision_geometry.py's own "BUG-
  # ALGORITHM BOUNDARY-LEAVE PRIMITIVES" section for the full reasoning.
  # crosses_segment(SX,SY,GX,GY) remains usable as a MoveTo TRIGGER
  # (see MoveTo's own triggers port above) -- just not as a Condition
  # leaf on its own.
  # ----------------------------------------------------------------
  - id: LineOfSightClear
    prolog_condition: line_of_sight_clear
    description: >
      True iff the CURRENT position (now/2 + at/4) is NOT occluded
      from goal by obstacle_id's own boundary -- a single-point check
      reusing the exact same underlying geometry (collision_geometry.py's
      line_of_sight_clear/segment_crosses_polygon) as the
      line_of_sight_clear(ObstacleId,GX,GY) TRIGGER (Bug0's own leave
      rule), just evaluated once instead of searched across a whole
      future trajectory.
    ports:
      - name: obstacle_id
        direction: input
        type: std::string
        required: true
        description: >
          Which obstacle_polygon/2 Id to check occlusion against --
          see PlanWith's own obstacle_id port.
      - name: goal
        direction: input
        type: Point
        required: true
        description: >
          The point line-of-sight is checked toward -- see PlanWith's
          own goal port.