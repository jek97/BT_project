# config.yaml -- problem5M
#
# Sibling of problem5L (orchard_map_a) and problem5S (orchard_map_c),
# all three sharing the SAME behavior_tree.xml shape (install_closest_
# plow / plan+walk / plough a swath / uninstall / plan+walk back) with
# different maps and coordinates. This file is problem5L's own
# config.yaml with ONLY these changes:
#   - initial_situation: on orchard_map_b.pgm (map.yaml), (9,27) --
#     the robot's start/return position for this map.
#   - tool.instances: the one plow instance moved to (8,9) -- this
#     problem's own chosen plow dock/drop position (behavior_tree.xml's
#     uninstall_plow p1 walks back there before uninstalling, so the
#     plow ends up back where it started).
# Everything else (drain rates, discretization steps, noise tables,
# tolerances, verification resolution) is KEPT identical to problem5L's
# own values, per this problem's own request.

initial_situation:
  start_x: 9    # metres
  start_y: 27   # metres

robot:
  radius: 0.20          # metres -- robot_radius/1
  safety_buffer: 0.10   # metres -- safety_buffer/1 (safety_margin = radius + safety_buffer)

motion:
  speed: 1.0   # metres per time-unit -- constant-speed spline traversal (speed/1)

position:
  disc_step_position: 0.5   # metres -- space-discretization merge-grid step
  lateral:
    sigma: 0.15   # metres per sqrt(time-unit) -- z/2's scale (sigma/1)
    discretized_gaussian:
      - value: -1.0
        weight: 0.25
      - value: 0.0
        weight: 0.5
      - value: 1.0
        weight: 0.25
  tangential:
    sigma: 0.15   # metres per sqrt(time-unit) -- zt/2's scale (sigma_tangential/1)
    discretized_gaussian:
      - value: -1.0
        weight: 0.25
      - value: 0.0
        weight: 0.5
      - value: 1.0
        weight: 0.25

battery:
  enabled: true
  start: 100                 # percent -- battery_start/1
  idle_drain_rate: 0.02      # percent/time-unit while not moving
  moving_drain_rate: 0.5     # percent/time-unit while moving
  sigma: 0.5   # percent per sqrt(time-unit) -- zbatt/1's scale (sigma_battery/1)
  disc_step_battery: 10   # percent
  discretized_gaussian:
    - value: -1.0
      weight: 0.25
    - value: 0.0
      weight: 0.5
    - value: 1.0
      weight: 0.25

tolerances:
  on_track: 0.5   # metres -- tolerance/1 (on_track/1 drift-reporting diagnostic)

verification:
  num_samples: 20        # reporting/plotting resolution -- decoupled from
                          # detection, which is exact (see bracket_samples below)
  bracket_samples: 60    # collision/obstacle_sighted bracket-scan sample count
  crossing_eps: 0.01     # bisection refinement tolerance, time-units

grounding:
  disc_step_time: 20   # seconds

tool:
  instances:
    - {id: plow1, kind: plow, x: 8.0, y: 9.0}

ploughing:
  cell_size: 1.0   # metres -- plough_cell_size/1
