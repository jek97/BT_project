# visualize_config.yaml
#
# SHARED by both visualize_ground_graph.py and
# visualize_compiled_graph.py -- see graph_viz_common.py's own header
# for what actually differs between the two (mainly: what counts as a
# "proof" -- sign-agnostic for the ground graph, "true leaves only"
# sign-aware for the compiled one) and, importantly, for the honest
# limits of the "shiny" effect below (matplotlib has no real specular
# lighting model; this fakes it with a bright glint marker + a light
# outline, it isn't true 3D shading).

# Where ground_nodes.json / compiled_nodes.json live -- both produced
# together by main.py's own --save-graphs flag (off by default; see
# README.md), written to output/<problem>/graphs/ by
# module/theory/graph_export.py.
graphs_dir: output/problem0S/graphs

# Which declared query is "the goal" this animation builds up to.
# null = auto-pick "verify_goal_formula" if the graph has it, else the
# first declared query (alphabetical) -- see pick_goal_index() in
# graph_viz_common.py for the exact fallback. Otherwise, the EXACT
# query string as it appears as a key in ground_nodes.json's/
# compiled_nodes.json's own "queries" map, e.g. "verify_goal_formula"
# or "plan_outcome(true)".
goal_query: null

# Common directory BOTH scripts write their own video into (e.g.
# ground_graph.mp4 and compiled_graph.mp4, extension picked from
# animation.writer below) -- null = interactive plt.show() for both
# instead (needs a display). See --output/--output-dir on either
# script to override this per-run without editing the config.
output_dir: output/problem0S/graph_videos

# --- static appearance ---------------------------------------------
background_color: white
node_color: "#999999"        # small grey balls
node_size: 18                # matplotlib scatter marker area (points^2)
edge_color: black
edge_width: 0.5
edge_alpha: 0.35

# --- camera spin, around the vertical axis (z, which this script's
# own layered layout already uses for "derivation depth": leaves at
# z=0, the goal/query node at the top) ------------------------------
spin:
  enabled: true
  degrees_per_second: 18
  elevation: 18               # fixed camera elevation angle, degrees

# --- step 1: after t1 seconds, the goal query node turns red and
# "shiny" (see the honest caveat above) ------------------------------
goal_highlight:
  t1_seconds: 3.0
  color: red
  size_multiplier: 2.5
  shiny: true

# --- step 2: n separate proof sub-DAGs for the goal light up, one
# every x_seconds after the goal's own highlight moment --------------
proof_paths:
  count: 5                    # n
  interval_seconds: 2.0       # x
  colors:                     # cycles if count > len(colors)
    - "#ff8c00"    # dark orange
    - "#e91e63"    # magenta/pink
    - "#00bcd4"    # cyan
    - "#7cb342"    # lime green
    - "#3f51b5"    # indigo
    - "#ffd600"    # gold
  size_multiplier: 1.8
  shiny: true
  # Safety cap on the proof-search itself -- enumerate_proofs/
  # enumerate_true_leaf_proofs stop (with a warning printed to
  # stderr) after this many node-visits even if fewer than `count`
  # distinct proofs were found yet; see graph_viz_common.py's own
  # note on why this search can blow up combinatorially on a large
  # real ground/compiled graph.
  max_search_steps: 200000

# --- animation / output ---------------------------------------------
animation:
  fps: 30
  # null = auto: t1_seconds + count*interval_seconds + tail_seconds,
  # one full reveal cycle, then the interactive window loops it again.
  duration_seconds: null
  tail_seconds: 3.0
  # Picks the file extension used under output_dir above ("ffmpeg" ->
  # .mp4, needs the ffmpeg binary on PATH; "pillow" -> .gif, no extra
  # binary needed). Only matters when output_dir (or --output/
  # --output-dir) is actually set -- with neither, both scripts open
  # an interactive window instead.
  writer: ffmpeg

# --- layout ----------------------------------------------------------
# Layered by derivation depth (leaves = depth 0 at the bottom, the
# goal/query node at the top), nodes at the same depth spread evenly
# around a ring -- see layered_layout_3d()'s own note for why this was
# chosen over a generic force-directed layout (O(n) vs O(n^2), and
# depth is already a meaningful axis for a proof DAG).
layout:
  ring_base_radius: 1.0
  ring_crowding_factor: 0.15
